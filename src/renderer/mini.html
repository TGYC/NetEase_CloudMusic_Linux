<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; script-src 'self'"
    />
    <title>迷你播放器</title>
    <link rel="stylesheet" href="mini.css" />
  </head>
  <body>
    <div class="card">
      <div class="card-actions">
        <button class="mini-btn pin" id="btnPin" title="置顶" aria-label="置顶">
          <svg viewBox="0 0 24 24" width="12" height="12"><path d="M15 4l5 5-3 1-2 5-4-2-3 3-1-1 3-3-2-4 5-2z" fill="currentColor"/></svg>
        </button>
        <button class="mini-btn close" id="btnClose" title="关闭迷你播放器" aria-label="关闭">
          <svg viewBox="0 0 12 12" width="10" height="10"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="cover">
        <img id="coverImg" alt="" />
        <div class="cover-fallback" id="coverFallback">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <path d="M9 18.5a2.5 2.5 0 1 1-1-2 2.5 2.5 0 0 1 1 2zm9-1a2.5 2.5 0 1 1-1-2 2.5 2.5 0 0 1 1 2zM9.2 18.5V7.2l9.6-2v11.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="info">
        <div class="title" id="title">未播放</div>
        <div class="artist" id="artist">打开主窗口选择歌曲</div>
      </div>

      <div class="controls">
        <button class="ctl" id="btnPrev" title="上一首" aria-label="上一首">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 5v14M18 6l-9 6 9 6z" fill="currentColor"/></svg>
        </button>
        <button class="ctl ctl-main" id="btnPlay" title="播放/暂停" aria-label="播放/暂停">
          <svg class="ic-play" viewBox="0 0 24 24" width="18" height="18"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24" width="18" height="18"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <button class="ctl" id="btnNext" title="下一首" aria-label="下一首">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M18 5v14M6 6l9 6-9 6z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <script src="mini.js"></script>
  </body>
</html>
